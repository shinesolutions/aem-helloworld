---
name: Release Minor
on: [workflow_dispatch]
# Least-privilege GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions);
# release-action checks out and pushes with the PAT passed as github_token
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: cliffano/release-action@v2.2.0
        with:
          release_type: minor
          github_token: ${{ secrets.SHINEOPENSOURCE_GITHUB_TOKEN }}
          git_user_email: opensource@shinesolutions.com
          git_user_name: Shine Solutions
