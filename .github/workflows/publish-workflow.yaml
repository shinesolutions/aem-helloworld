---
name: Publish to Maven Central
'on':
  push:
    tags:
      - 'aem-helloworld-*'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    # Java 11, as the project requires
    container: maven:3.9.11-eclipse-temurin-11
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update -qq && apt-get install -y -qq make
      - env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.SHINEOPENSOURCE_MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.SHINEOPENSOURCE_MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.SHINEOPENSOURCE_MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SHINEOPENSOURCE_MAVEN_GPG_PASSPHRASE }}
        run: make publish
